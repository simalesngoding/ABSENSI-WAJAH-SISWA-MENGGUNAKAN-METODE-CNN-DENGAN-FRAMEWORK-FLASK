<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Absensi Wajah</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(15,23,42,0.08); }
    .video-container {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #000;
      display: block;
      aspect-ratio: 16 / 9;
      max-height: 70vh;
    }
    img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    button { padding: 12px 16px; margin-top: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .message { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #ecfdf5; color: #166534; }
    .prediction { margin-top: 12px; font-size: 1.05rem; }

    @media (max-width: 640px) {
      .wrap { padding: 16px; }
      .card { padding: 16px; }
      .video-container { max-height: 55vh; }
      .prediction { font-size: 1rem; }
      button { width: 100%; }
    }
  </style>
</head>
  <div class="wrap">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
      <h2 style="margin:0;">Absensi Siswa</h2>
      <div>
        <a href="{{ url_for('dashboard') }}" style="color:#2563eb; text-decoration:none; font-weight:700; margin-right:12px;">Dashboard</a>
        <a href="{{ url_for('register_student') }}" style="color:#2563eb; text-decoration:none; font-weight:700;">Daftar Siswa</a>
      </div>
    </div>

    <div class="card">
      <h2>Absensi Siswa</h2>
      <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="Video absensi" />
      </div>
      <form id="attendanceForm" method="post">
        <button id="attendanceButton" type="submit">Absensi Sekarang</button>
      </form>
      <div id="attendanceMessage" class="message" style="display: {% if message %}block{% else %}none{% endif %};"><strong>{% if message %}{{ message }}{% endif %}</strong></div>
      <p class="prediction">Prediksi saat ini: <strong>{{ current_prediction['name'] }}</strong></p>
    </div>
  </div>
  <script>
    const form = document.getElementById('attendanceForm');
    const messageBox = document.getElementById('attendanceMessage');
    const button = document.getElementById('attendanceButton');

    if (form && messageBox && button) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = 'Memproses...';
        messageBox.style.display = 'block';
        messageBox.innerHTML = '<strong>Memproses absensi...</strong>';

        try {
          const response = await fetch('{{ url_for("attendance") }}', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: new FormData(form)
          });
          const data = await response.json();
          messageBox.innerHTML = `<strong>${data.message || 'Absensi selesai'}</strong>`;
        } catch (error) {
          messageBox.innerHTML = '<strong>Gagal mengirim absensi. Silakan coba lagi.</strong>';
        } finally {
          button.disabled = false;
          button.textContent = 'Absensi Sekarang';
        }
      });
    }
  </script>
</body>
</html>
