<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register Account</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #16a34a);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #0f172a;
    }
    .card {
      width: min(92vw, 440px);
      background: rgba(255,255,255,0.96);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }
    h2 { margin-top: 0; margin-bottom: 8px; }
    p { color: #475569; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    }
    input:focus { outline: 2px solid #86efac; border-color: #4ade80; }
    button {
      width: 100%; padding: 12px; background: linear-gradient(90deg, #16a34a, #22c55e); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    .error { color: #dc2626; margin-bottom: 10px; font-weight: 600; }
    a { color: #16a34a; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Buat Akun Baru</h2>
    <p>Daftarkan akun admin untuk memulai sistem absensi.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required>
      <button type="submit">Daftar</button>
    </form>
    <p style="margin-top: 14px;">Sudah punya akun? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</body>
</html>
